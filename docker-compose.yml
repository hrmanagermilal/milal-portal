services:
  db:
    image: mysql:8.0
    container_name: milal-room-reservation-db
    networks:
      - milal-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-milal_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-milal_room_reservation}
      MYSQL_USER: ${MYSQL_USER:-milal_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-milal_password_2026}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milal-room-reservation
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8083:7000"
    volumes:
      - expense_uploads:/app/uploads
    networks:
      - milal-network
      - milal-shared
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6IjRaJny1xWFqE4FE2VbeINcE4XSVv8STPpNiX0gsUPfw}
      OHJIC_API_KEY: ${OHJIC_API_KEY}
      OHJIC_API_BASE_URL: ${OHJIC_API_BASE_URL:-https://api.ohjic.us}
    restart: unless-stopped

volumes:
  mysql_data:
  expense_uploads:

networks:
  milal-network:
    driver: bridge
  milal-shared:
    external: true
